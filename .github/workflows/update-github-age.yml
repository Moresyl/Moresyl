name: Update GitHub account age

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update account age
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const username = context.repo.owner;
            const { data: user } = await github.rest.users.getByUsername({ username });
            const created = new Date(user.created_at);
            const now = new Date();
            let years = now.getUTCFullYear() - created.getUTCFullYear();
            const anniversaryPassed =
              now.getUTCMonth() > created.getUTCMonth() ||
              (now.getUTCMonth() === created.getUTCMonth() &&
                now.getUTCDate() >= created.getUTCDate());
            if (!anniversaryPassed) years -= 1;

            const month = created.toLocaleString("en-US", {
              month: "long",
              timeZone: "UTC",
            });
            const since = month + " " + created.getUTCDate() + ", " + created.getUTCFullYear();
            const replacement =
              "<!-- github-age:start -->\n<p align=\"center\"><strong>GitHub member for " + years + " years</strong> · Since " + since + "</p>\n<!-- github-age:end -->";

            const path = "README.md";
            const readme = fs.readFileSync(path, "utf8");
            const updated = readme.replace(
              /<!-- github-age:start -->[\s\S]*?<!-- github-age:end -->/,
              replacement,
            );
            if (updated === readme) {
              core.info("GitHub account age is already current.");
              return;
            }
            fs.writeFileSync(path, updated);

      - name: Commit updated age
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update GitHub account age"
          git push
